# robot_localization EKF: wheel odometry + IMU -> odom -> base_footprint.
#
# Fuses velocities only. Wheel and gyro positions drift without bound, so
# integrating their poses again here would double-count; the EKF integrates
# the velocities itself. Absolute position comes later from SLAM (map -> odom).
#
#   /wheel/odom     forward speed (vx), sideways speed (vy = 0, skid-steer cannot
#                   slide sideways), yaw rate with a large variance
#   /imu/data_raw   yaw rate from the gyro - the one to trust for heading
#
# Output: /odometry/filtered and the odom -> base_footprint transform.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10

    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
